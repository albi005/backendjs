<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Új állat - Állatorvosi rendelő</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/">Oltások</a>
        <a href="/owners.html">Tulajdonosok</a>
        <a class="active" href="/animals.html">Állatok</a>
    </nav>

    <main class="detail">
        <div class="entity">
            <div class="fields">
                <div class="field">
                    <span class="label">Név:</span>
                    <input class="editable" type="text" value="" placeholder="Bodri" aria-label="Név">
                </div>

                <div class="field">
                    <span class="label">Faj:</span>
                    <input class="editable" type="text" value="" placeholder="Kutya" aria-label="Faj">
                </div>

                <div class="field">
                    <span class="label">Tulajdonos:</span>
                    <select class="editable" aria-label="Tulajdonos">
                        <option value="">Válassz tulajdonost</option>
                        <option value="1">Balogh Ágnes</option>
                        <option value="2">Farkas Attila</option>
                        <option value="3">Horváth Zoltán</option>
                        <option value="4">Kiss Sándor</option>
                        <option value="5">Kovács István</option>
                        <option value="6">Molnár Gábor</option>
                        <option value="7">Nagy Erzsébet</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="icon-btn save" type="button" title="Mentés" aria-label="Mentés">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><rect x="8" y="13" width="8" height="5"/></svg>
                </button>
            </div>
        </div>
    </main>
</body>
</html>
