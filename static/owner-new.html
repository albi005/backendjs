<!doctype html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Új tulajdonos - Állatorvosi rendelő</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/">Oltások</a>
        <a href="/owners.html">Tulajdonosok</a>

    <main class="detail">
        <div class="field">
            <span class="label">Név:</span>
            <input class="editable" type="text" value="" placeholder="Szabó Anna" aria-label="Név">
            <button class="icon-btn save" type="button" title="Mentés" aria-label="Mentés">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><rect x="8" y="13" width="8" height="5"/></svg>
            </button>
        </div>

        <div class="field">
            <span class="label">Cím:</span>
            <input class="editable" type="text" value="" placeholder="Budapest, Fő utca 1." aria-label="Cím">
        </div>

        <div class="field">
            <span class="label">Elérhetőség:</span>
            <input class="editable" type="text" value="" placeholder="+36 30 000 0000" aria-label="Elérhetőség">
        </div>
    </main>
