<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Animal - Veterinary Clinic</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <a href="/">Vaccinations</a>
    <a href="/owners">Owners</a>
    <a href="/animals">Animals</a>
  </nav>

  <main class="detail">
    <div class="field">
      <span class="label">Name:</span>
      <input class="editable" type="text" value="" placeholder="Name" aria-label="Name">
      <button class="icon-btn save" type="button" title="Save" aria-label="Save">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><rect x="8" y="13" width="8" height="5"/></svg>
      </button>
    </div>

    <div class="field">
      <span class="label">Species:</span>
      <input class="editable" type="text" value="" placeholder="Species" aria-label="Species">
    </div>

    <div class="field">
      <span class="label">Owner:</span>
      <select class="editable" aria-label="Owner">
        <option value="">Select owner</option>
        <option value="1">Alice Carter</option>
        <option value="2">Bob Fisher</option>
        <option value="3">Carol Danvers</option>
        <option value="4">David Evans</option>
        <option value="5">Emma Frost</option>
        <option value="6">Frank Lawson</option>
      </select>
    </div>
  </main>
</body>
</html>
